<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefact Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/my-favicon/./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/./favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/my-favicon/./site.webmanifest" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Product Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .topbar {
            display: flex;
            align-items: center;
            padding: 1rem 2rem;
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }
        .back-link {
            margin-left: auto;
            text-decoration: none;
            color: #fff;
            border: 1px solid #555;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .container {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            grid-auto-rows: 220px;
            grid-auto-flow: dense;
            gap: 1rem;
        }
        .resource {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
        }
        .resource-title {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .resource.large {
            grid-row: span 2;
            grid-column: span 2;
        }
        .resource.articles {
            align-items: stretch;
            justify-content: flex-start;
            gap: 1rem;
            overflow: hidden;
        }
        .articles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .article-count {
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 999px;
            color: rgba(255,255,255,0.72);
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            white-space: nowrap;
        }
        .featured-article,
        .article-link {
            color: inherit;
            text-decoration: none;
        }
        .featured-article {
            background: linear-gradient(145deg, rgba(77, 208, 225, 0.16), rgba(255, 193, 7, 0.08));
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 8px;
            display: block;
            padding: 1rem;
        }
        .article-label {
            color: #79dce8;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 0.55rem;
            text-transform: uppercase;
        }
        .article-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.25;
        }
        .featured-article .article-title {
            font-size: 1.22rem;
        }
        .article-definition {
            color: rgba(255,255,255,0.72);
            font-size: 0.84rem;
            line-height: 1.45;
            margin-top: 0.55rem;
        }
        .article-list {
            display: grid;
            gap: 0.55rem;
        }
        .article-link {
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 8px;
            display: grid;
            gap: 0.25rem;
            padding: 0.75rem;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .article-link:hover,
        .article-link:focus {
            background: rgba(255,255,255,0.06);
            border-color: rgba(121,220,232,0.45);
            outline: none;
        }
        .article-link .article-title {
            font-size: 0.92rem;
        }
        .article-link .article-definition {
            font-size: 0.78rem;
            margin-top: 0;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 2rem;
            font-size: 2rem;
            text-align: center;
        }
        .placeholder {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        @media (max-width: 600px) {
            .topbar {
                flex-direction: column;
            }

            .back-link {
                margin-left: 0;
                margin-top: 0.5rem;
            }

            .container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                grid-auto-rows: 150px;
            }

            .resource.articles {
                grid-column: 1 / -1;
                grid-row: span 4;
                overflow: visible;
            }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="logo" href="index.html">Not Some AI</a>
        <a class="back-link" href="index.html">Back</a>
    </nav>
    <main id="content">
        <h1 id="artefact-name"></h1>
        <div id="construction-note" class="placeholder" style="text-align: center;">(resources under construction)</div>
        <div class="container" id="resource-grid"></div>
    </main>
    <script>
        async function loadArtefact() {
            const params = new URLSearchParams(window.location.search);
            const artefactName = params.get('artefact');
            if (!artefactName) return;
            const res = await fetch('artefacts.json');
            const data = await res.json();
            const artefact = data.artefacts.find(a => a.name.toLowerCase() === artefactName.toLowerCase());
            if (!artefact) {
                document.getElementById('artefact-name').textContent = 'Artefact not found';
                return;
            }
            document.getElementById('artefact-name').textContent = artefact.name;
            const grid = document.getElementById('resource-grid');
            const resources = [
                { key: 'code', label: 'Code Examples' },
                { key: 'videos', label: 'Videos' },
                { key: 'articles', label: 'Articles' },
                { key: 'discussions', label: 'User Discussions' },
                { key: 'polls', label: 'Interactive Polls' }
            ];
            resources.forEach((r, idx) => {
                const block = document.createElement('div');
                const items = artefact.resources?.[r.key] || [];
                block.className = 'resource' + (idx % 2 === 0 ? ' large' : '') + (r.key === 'articles' && items.length ? ' articles' : '');
                const title = document.createElement('div');
                title.className = 'resource-title';
                title.textContent = r.label;

                if (r.key === 'articles' && items.length) {
                    const header = document.createElement('div');
                    header.className = 'articles-header';

                    const count = document.createElement('span');
                    count.className = 'article-count';
                    count.textContent = `${items.length} reads`;

                    header.append(title, count);
                    block.appendChild(header);
                    block.appendChild(createFeaturedArticle(items[0]));

                    const list = document.createElement('div');
                    list.className = 'article-list';
                    items.slice(1).forEach(article => list.appendChild(createArticleLink(article)));
                    block.appendChild(list);
                    grid.appendChild(block);
                    return;
                }

                block.appendChild(title);
                grid.appendChild(block);
            });
        }

        function createFeaturedArticle(article) {
            const link = createArticleBase(article);
            link.className = 'featured-article';

            const label = document.createElement('div');
            label.className = 'article-label';
            label.textContent = 'Featured article';

            link.prepend(label);
            return link;
        }

        function createArticleLink(article) {
            const link = createArticleBase(article);
            link.className = 'article-link';
            return link;
        }

        function createArticleBase(article) {
            const link = document.createElement('a');
            link.href = article.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';

            const title = document.createElement('div');
            title.className = 'article-title';
            title.textContent = article.title;

            const definition = document.createElement('p');
            definition.className = 'article-definition';
            definition.textContent = article.definition;

            link.append(title, definition);
            return link;
        }
        loadArtefact();
    </script>
</body>
</html>
