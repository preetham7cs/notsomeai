<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefact Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/my-favicon/./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/./favicon.svg" />
    <link rel="shortcut icon" href="/my-favicon/./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/my-favicon/./site.webmanifest" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Product Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .topbar {
            display: flex;
            align-items: center;
            padding: 1rem 2rem;
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            color: inherit;
        }
        .back-link {
            margin-left: auto;
            text-decoration: none;
            color: #fff;
            border: 1px solid #555;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .container {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            grid-auto-rows: 220px;
            grid-auto-flow: dense;
            gap: 1rem;
        }
        .resource {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
        }
        .resource-title {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .resource.large {
            grid-row: span 2;
            grid-column: span 2;
        }
        .resource.articles,
        .resource.code,
        .resource.videos,
        .resource.polls {
            align-items: stretch;
            justify-content: flex-start;
            gap: 1rem;
            overflow: hidden;
            min-height: 0;
        }
        .resource.videos {
            grid-row: span 2;
            grid-column: span 3;
        }
        .resource.polls {
            grid-row: span 2;
            grid-column: span 4;
            gap: 1.35rem;
            padding: 2rem;
        }
        .resource.code {
            grid-row: span 2;
            grid-column: span 2;
        }
        .articles-header,
        .code-header,
        .videos-header,
        .polls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .article-count,
        .code-count,
        .video-count,
        .poll-count {
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 999px;
            color: rgba(255,255,255,0.72);
            font-size: 0.75rem;
            padding: 0.2rem 0.55rem;
            white-space: nowrap;
        }
        .article-link,
        .video-card {
            color: inherit;
            text-decoration: none;
        }
        .article-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.25;
        }
        .article-definition {
            color: rgba(255,255,255,0.72);
            font-size: 0.84rem;
            line-height: 1.45;
            margin-top: 0.55rem;
        }
        .article-list {
            display: grid;
            gap: 0.55rem;
            overflow-y: auto;
            padding-right: 0.35rem;
            scrollbar-color: rgba(121,220,232,0.45) rgba(255,255,255,0.08);
            scrollbar-width: thin;
        }
        .article-list::-webkit-scrollbar {
            width: 8px;
        }
        .article-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
        }
        .article-list::-webkit-scrollbar-thumb {
            background: rgba(121,220,232,0.45);
            border-radius: 999px;
        }
        .article-link {
            border: 1px solid rgba(255,255,255,0.11);
            border-radius: 8px;
            display: grid;
            gap: 0.25rem;
            padding: 0.75rem;
            transition: background 0.2s ease, border-color 0.2s ease, padding 0.2s ease;
        }
        .article-link:hover,
        .article-link:focus {
            background: linear-gradient(145deg, rgba(77, 208, 225, 0.16), rgba(255, 193, 7, 0.08));
            border-color: rgba(121,220,232,0.45);
            outline: none;
            padding: 1rem;
        }
        .article-link .article-title {
            font-size: 0.92rem;
            transition: font-size 0.2s ease;
        }
        .article-link:hover .article-title,
        .article-link:focus .article-title {
            font-size: 1.22rem;
        }
        .article-link .article-definition {
            font-size: 0.78rem;
            margin-top: 0;
            transition: font-size 0.2s ease, margin-top 0.2s ease;
        }
        .article-link:hover .article-definition,
        .article-link:focus .article-definition {
            font-size: 0.84rem;
            margin-top: 0.55rem;
        }
        .video-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            flex: 1;
            min-height: 0;
        }
        .video-card {
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(255,255,255,0.035);
            min-width: 0;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .video-card:hover,
        .video-card:focus {
            background: rgba(255,255,255,0.065);
            border-color: rgba(255,193,7,0.45);
            outline: none;
            transform: translateY(-2px);
        }
        .video-thumb {
            aspect-ratio: 16 / 9;
            background: linear-gradient(145deg, rgba(77,208,225,0.18), rgba(255,193,7,0.12));
            background-position: center;
            background-size: cover;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: grid;
            flex: 1;
            min-height: 0;
            place-items: center;
            position: relative;
        }
        .video-thumb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.28));
        }
        .play-icon {
            align-items: center;
            background: rgba(0,0,0,0.68);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 999px;
            color: #fff;
            display: flex;
            height: 2.6rem;
            justify-content: center;
            position: relative;
            width: 2.6rem;
            z-index: 1;
        }
        .play-icon::before {
            content: "";
            border-bottom: 0.45rem solid transparent;
            border-left: 0.7rem solid currentColor;
            border-top: 0.45rem solid transparent;
            margin-left: 0.18rem;
        }
        .video-info {
            display: grid;
            gap: 0.55rem;
            padding: 1rem;
        }
        .video-title {
            font-size: 0.94rem;
            font-weight: 600;
            line-height: 1.25;
        }
        .video-action {
            color: #79dce8;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .poll-question {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.35;
            max-width: 56rem;
        }
        .poll-wrapper {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 1.35rem;
            min-height: 0;
        }
        .poll-body {
            display: grid;
            grid-template-columns: minmax(220px, 0.8fr) minmax(320px, 1.2fr);
            gap: 1.4rem;
            flex: 1;
            min-height: 0;
        }
        .poll-actions {
            display: grid;
            gap: 0.95rem;
            align-content: start;
        }
        .poll-option {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 8px;
            color: inherit;
            cursor: pointer;
            display: grid;
            gap: 0.35rem;
            font: inherit;
            padding: 1rem;
            text-align: left;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .poll-option:hover,
        .poll-option:focus,
        .poll-option.selected {
            background: linear-gradient(145deg, rgba(77,208,225,0.15), rgba(255,193,7,0.08));
            border-color: rgba(121,220,232,0.5);
            outline: none;
        }
        .poll-option strong {
            font-size: 1.35rem;
        }
        .poll-option span {
            color: rgba(255,255,255,0.66);
            font-size: 0.78rem;
        }
        .poll-submit {
            background: #79dce8;
            border: 0;
            border-radius: 8px;
            color: #001014;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 0.8rem 1rem;
        }
        .poll-note {
            background: rgba(0,0,0,0.22);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 8px;
            color: #fff;
            font: inherit;
            min-height: 5.2rem;
            padding: 0.75rem;
            resize: vertical;
            width: 100%;
        }
        .poll-note::placeholder {
            color: rgba(255,255,255,0.42);
        }
        .poll-status {
            color: rgba(255,255,255,0.66);
            font-size: 0.8rem;
            min-height: 1rem;
        }
        .poll-visual {
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            display: grid;
            gap: 1rem;
            min-height: 0;
            padding: 1.15rem;
        }
        .poll-total {
            color: rgba(255,255,255,0.66);
            font-size: 0.78rem;
            text-transform: uppercase;
        }
        .poll-bars {
            display: grid;
            gap: 0.55rem;
        }
        .poll-bar-row {
            display: grid;
            gap: 0.25rem;
        }
        .poll-bar-meta {
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.78);
            font-size: 0.82rem;
        }
        .poll-bar-track {
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            height: 0.55rem;
            overflow: hidden;
        }
        .poll-bar-fill {
            background: #79dce8;
            border-radius: inherit;
            height: 100%;
            min-width: 2px;
        }
        .poll-bar-fill.no {
            background: #ffc247;
        }
        .poll-chart {
            min-height: 160px;
            width: 100%;
        }
        .code-editor {
            background: #080b10;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 8px;
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        .code-editor-bar {
            align-items: center;
            background: rgba(255,255,255,0.055);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.58);
            display: flex;
            font-size: 0.74rem;
            gap: 0.45rem;
            padding: 0.55rem 0.75rem;
        }
        .code-dot {
            border-radius: 999px;
            height: 0.58rem;
            width: 0.58rem;
        }
        .code-dot.red { background: #ff5f57; }
        .code-dot.yellow { background: #ffbd2e; }
        .code-dot.green { background: #28c840; }
        .code-file {
            margin-left: 0.35rem;
        }
        .code-body {
            color: #d8e2f0;
            flex: 1;
            font: 0.86rem/1.55 Consolas, Monaco, 'Courier New', monospace;
            margin: 0;
            overflow: auto;
            padding: 1rem;
            white-space: pre;
        }
        .code-keyword { color: #79dce8; }
        .code-name { color: #ffc247; }
        .code-param { color: #b9f18d; }
        .code-ellipsis { color: rgba(255,255,255,0.48); }
        .poll-chart text {
            fill: rgba(255,255,255,0.62);
            font-size: 10px;
        }
        .poll-chart .grid-line {
            stroke: rgba(255,255,255,0.1);
            stroke-width: 1;
        }
        .poll-chart .yes-line {
            fill: none;
            stroke: #79dce8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 3;
        }
        .poll-chart .no-line {
            fill: none;
            stroke: #ffc247;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 3;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 2rem;
            font-size: 2rem;
            text-align: center;
        }
        .placeholder {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        @media (max-width: 760px) {
            .topbar {
                flex-direction: column;
            }

            .back-link {
                margin-left: 0;
                margin-top: 0.5rem;
            }

            .container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                grid-auto-rows: 150px;
            }

            .resource.articles,
            .resource.code,
            .resource.videos,
            .resource.polls {
                grid-column: 1 / -1;
                grid-row: span 4;
            }

            .resource.polls {
                grid-row: span 6;
            }

            .video-list,
            .poll-body {
                grid-template-columns: 1fr;
                overflow-y: auto;
                padding-right: 0.35rem;
            }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a class="logo" href="index.html">Not Some AI</a>
        <a class="back-link" href="index.html">Back</a>
    </nav>
    <main id="content">
        <h1 id="artefact-name"></h1>
        <div id="construction-note" class="placeholder" style="text-align: center;">(resources under construction)</div>
        <div class="container" id="resource-grid"></div>
    </main>
    <script>
        async function loadArtefact() {
            const params = new URLSearchParams(window.location.search);
            const artefactName = params.get('artefact');
            if (!artefactName) return;
            const res = await fetch('artefacts.json');
            const data = await res.json();
            const artefact = data.artefacts.find(a => a.name.toLowerCase() === artefactName.toLowerCase());
            if (!artefact) {
                document.getElementById('artefact-name').textContent = 'Artefact not found';
                return;
            }
            let poll = null;
            try {
                const pollRes = await fetch('polls.json');
                const pollData = await pollRes.json();
                poll = pollData.polls.find(p => p.artefact.toLowerCase() === artefact.name.toLowerCase());
            } catch (error) {
                poll = null;
            }
            document.getElementById('artefact-name').textContent = artefact.name;
            const grid = document.getElementById('resource-grid');
            const resources = [
                { key: 'polls', label: 'Interactive Polls' },
                { key: 'videos', label: 'Videos' },
                { key: 'articles', label: 'Articles' },
                { key: 'code', label: 'Code Examples' },
                { key: 'discussions', label: 'User Discussions' }
            ];
            const hasPopulatedResources = resources.some(({ key }) => (artefact.resources?.[key] || []).length > 0);
            const constructionNote = document.getElementById('construction-note');
            if (constructionNote && (hasPopulatedResources || poll)) {
                constructionNote.hidden = true;
            }
            resources.forEach((r, idx) => {
                const block = document.createElement('div');
                const items = artefact.resources?.[r.key] || [];
                const isLargePlaceholder = !['code', 'videos', 'polls'].includes(r.key) && idx % 2 === 0;
                block.className = 'resource' + (isLargePlaceholder ? ' large' : '') + (r.key === 'articles' && items.length ? ' articles' : '') + (r.key === 'code' && items.length ? ' code' : '') + (r.key === 'videos' && items.length ? ' videos' : '') + (r.key === 'polls' && poll ? ' polls' : '');
                const title = document.createElement('div');
                title.className = 'resource-title';
                title.textContent = r.label;

                if (r.key === 'polls' && poll) {
                    block.appendChild(createPollBlock(title, poll));
                    grid.appendChild(block);
                    return;
                }

                if (r.key === 'videos' && items.length) {
                    const header = document.createElement('div');
                    header.className = 'videos-header';

                    const count = document.createElement('span');
                    count.className = 'video-count';
                    count.textContent = `${items.length} videos`;

                    header.append(title, count);
                    block.appendChild(header);

                    const list = document.createElement('div');
                    list.className = 'video-list';
                    items.forEach(video => list.appendChild(createVideoCard(video)));
                    block.appendChild(list);
                    grid.appendChild(block);
                    return;
                }

                if (r.key === 'articles' && items.length) {
                    const header = document.createElement('div');
                    header.className = 'articles-header';

                    const count = document.createElement('span');
                    count.className = 'article-count';
                    count.textContent = `${items.length} reads`;

                    header.append(title, count);
                    block.appendChild(header);

                    const list = document.createElement('div');
                    list.className = 'article-list';
                    items.forEach(article => list.appendChild(createArticleLink(article)));
                    block.appendChild(list);
                    grid.appendChild(block);
                    return;
                }

                if (r.key === 'code' && items.length) {
                    const header = document.createElement('div');
                    header.className = 'code-header';

                    const count = document.createElement('span');
                    count.className = 'code-count';
                    count.textContent = `${items.length} example${items.length === 1 ? '' : 's'}`;

                    header.append(title, count);
                    block.appendChild(header);
                    block.appendChild(createCodeEditor(items[0]));
                    grid.appendChild(block);
                    return;
                }

                block.appendChild(title);
                grid.appendChild(block);
            });
        }

        function createPollBlock(title, poll) {
            const wrapper = document.createElement('div');
            wrapper.className = 'poll-wrapper';

            const header = document.createElement('div');
            header.className = 'polls-header';
            const count = document.createElement('span');
            count.className = 'poll-count';
            count.textContent = '1 poll';
            header.append(title, count);

            const question = document.createElement('div');
            question.className = 'poll-question';
            question.textContent = poll.question;

            const body = document.createElement('div');
            body.className = 'poll-body';

            const actions = document.createElement('div');
            actions.className = 'poll-actions';

            const state = getPollState(poll);
            const yesButton = createPollOption('Yes', 'Likely', state.choice === 'yes');
            const noButton = createPollOption('No', 'Unlikely', state.choice === 'no');
            let selected = state.choice;

            yesButton.addEventListener('click', () => {
                selected = 'yes';
                yesButton.classList.add('selected');
                noButton.classList.remove('selected');
            });
            noButton.addEventListener('click', () => {
                selected = 'no';
                noButton.classList.add('selected');
                yesButton.classList.remove('selected');
            });

            const note = document.createElement('textarea');
            note.className = 'poll-note';
            note.placeholder = 'Add a short note, if needed';
            note.value = state.note || '';

            const submit = document.createElement('button');
            submit.className = 'poll-submit';
            submit.type = 'button';
            submit.textContent = state.choice ? 'Update local vote' : 'Submit vote';

            const status = document.createElement('div');
            status.className = 'poll-status';
            status.textContent = state.choice ? 'Your vote is saved in this browser.' : '';

            const visual = document.createElement('div');
            visual.className = 'poll-visual';
            renderPollVisual(visual, poll, state);

            submit.addEventListener('click', () => {
                if (!selected) {
                    status.textContent = 'Choose Yes or No before submitting.';
                    return;
                }
                const nextState = { choice: selected, note: note.value.trim() };
                localStorage.setItem(`poll:${poll.id}`, JSON.stringify(nextState));
                status.textContent = 'Saved in this browser. Global GitHub-backed counts need a backend endpoint.';
                renderPollVisual(visual, poll, nextState);
                submit.textContent = 'Update local vote';
            });

            actions.append(yesButton, noButton, note, submit, status);
            body.append(actions, visual);
            wrapper.append(header, question, body);
            return wrapper;
        }

        function createPollOption(label, hint, selected) {
            const button = document.createElement('button');
            button.className = 'poll-option' + (selected ? ' selected' : '');
            button.type = 'button';
            const strong = document.createElement('strong');
            strong.textContent = label;
            const span = document.createElement('span');
            span.textContent = hint;
            button.append(strong, span);
            return button;
        }

        function getPollState(poll) {
            try {
                return JSON.parse(localStorage.getItem(`poll:${poll.id}`)) || {};
            } catch (error) {
                return {};
            }
        }

        function getPollCounts(poll, state) {
            const counts = { yes: poll.votes?.yes || 0, no: poll.votes?.no || 0 };
            if (state.choice === 'yes') counts.yes += 1;
            if (state.choice === 'no') counts.no += 1;
            return counts;
        }

        function renderPollVisual(container, poll, state) {
            container.innerHTML = '';
            const counts = getPollCounts(poll, state);
            const total = counts.yes + counts.no;
            const yesPct = total ? Math.round((counts.yes / total) * 100) : 50;
            const noPct = total ? 100 - yesPct : 50;

            const totalEl = document.createElement('div');
            totalEl.className = 'poll-total';
            totalEl.textContent = total ? `Current vote: ${total} response${total === 1 ? '' : 's'}` : 'Current vote: no responses yet';

            const bars = document.createElement('div');
            bars.className = 'poll-bars';
            bars.append(createPollBar('Yes', yesPct, false), createPollBar('No', noPct, true));

            const chart = createPollChart(poll, yesPct, noPct);
            container.append(totalEl, bars, chart);
        }

        function createPollBar(label, pct, isNo) {
            const row = document.createElement('div');
            row.className = 'poll-bar-row';
            const meta = document.createElement('div');
            meta.className = 'poll-bar-meta';
            meta.innerHTML = `<span>${label}</span><span>${pct}%</span>`;
            const track = document.createElement('div');
            track.className = 'poll-bar-track';
            const fill = document.createElement('div');
            fill.className = 'poll-bar-fill' + (isNo ? ' no' : '');
            fill.style.width = `${pct}%`;
            track.appendChild(fill);
            row.append(meta, track);
            return row;
        }

        function createPollChart(poll, yesPct, noPct) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'poll-chart');
            svg.setAttribute('viewBox', '0 0 420 180');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', 'Vote trend graph');
            [30, 70, 110, 150].forEach(y => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('class', 'grid-line');
                line.setAttribute('x1', '24');
                line.setAttribute('x2', '398');
                line.setAttribute('y1', y);
                line.setAttribute('y2', y);
                svg.appendChild(line);
            });
            const history = poll.history?.length ? poll.history : [
                { yes: 50, no: 50 },
                { yes: 50, no: 50 },
                { yes: yesPct, no: noPct }
            ];
            svg.append(createTrendPath(history.map(p => p.yes), 'yes-line'));
            svg.append(createTrendPath(history.map(p => p.no), 'no-line'));
            const yesLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            yesLabel.setAttribute('x', '24');
            yesLabel.setAttribute('y', '174');
            yesLabel.textContent = 'Yes trend';
            const noLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            noLabel.setAttribute('x', '328');
            noLabel.setAttribute('y', '174');
            noLabel.textContent = 'No trend';
            svg.append(yesLabel, noLabel);
            return svg;
        }

        function createTrendPath(values, className) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const width = 374;
            const step = values.length > 1 ? width / (values.length - 1) : width;
            const d = values.map((value, index) => {
                const x = 24 + index * step;
                const y = 150 - (Math.max(0, Math.min(100, value)) / 100) * 120;
                return `${index === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
            }).join(' ');
            path.setAttribute('class', className);
            path.setAttribute('d', d);
            return path;
        }

        function createVideoCard(video) {
            const link = document.createElement('a');
            link.className = 'video-card';
            link.href = video.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';

            const thumb = document.createElement('div');
            thumb.className = 'video-thumb';
            const videoId = getYouTubeId(video.url);
            if (videoId) {
                thumb.style.backgroundImage = `url(https://img.youtube.com/vi/${videoId}/hqdefault.jpg)`;
            }

            const play = document.createElement('span');
            play.className = 'play-icon';
            play.setAttribute('aria-hidden', 'true');
            thumb.appendChild(play);

            const info = document.createElement('div');
            info.className = 'video-info';

            const title = document.createElement('div');
            title.className = 'video-title';
            title.textContent = video.title;

            const action = document.createElement('div');
            action.className = 'video-action';
            action.textContent = 'Watch';

            info.append(title, action);
            link.append(thumb, info);
            return link;
        }

        function getYouTubeId(url) {
            try {
                const parsed = new URL(url);
                if (parsed.hostname.includes('youtu.be')) return parsed.pathname.slice(1);
                if (parsed.hostname.includes('youtube.com')) return parsed.searchParams.get('v');
            } catch (error) {
                return null;
            }
            return null;
        }

        function createArticleLink(article) {
            const link = createArticleBase(article);
            link.className = 'article-link';
            return link;
        }

        function createCodeEditor(example) {
            const editor = document.createElement('div');
            editor.className = 'code-editor';

            const bar = document.createElement('div');
            bar.className = 'code-editor-bar';
            ['red', 'yellow', 'green'].forEach(color => {
                const dot = document.createElement('span');
                dot.className = `code-dot ${color}`;
                bar.appendChild(dot);
            });
            const filename = document.createElement('span');
            filename.className = 'code-file';
            filename.textContent = example.filename || 'example.py';
            bar.appendChild(filename);

            const body = document.createElement('pre');
            body.className = 'code-body';
            body.innerHTML = highlightPythonSignature(example.code);

            editor.append(bar, body);
            return editor;
        }

        function highlightPythonSignature(code) {
            const escaped = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            return escaped
                .replace(/^def\\s+([a-zA-Z_][\\w]*)\\(([^)]*)\\):/m, (_, name, params) => {
                    const highlightedParams = params
                        .split(',')
                        .map(param => `<span class="code-param">${param.trim()}</span>`)
                        .join(', ');
                    return `<span class="code-keyword">def</span> <span class="code-name">${name}</span>(${highlightedParams}):`;
                })
                .replace(/\\.\\.\\.\\.\\.\\./g, '<span class="code-ellipsis">......</span>');
        }

        function createArticleBase(article) {
            const link = document.createElement('a');
            link.href = article.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';

            const title = document.createElement('div');
            title.className = 'article-title';
            title.textContent = article.title;

            const definition = document.createElement('p');
            definition.className = 'article-definition';
            definition.textContent = article.definition;

            link.append(title, definition);
            return link;
        }
        loadArtefact();
    </script>
</body>
</html>
